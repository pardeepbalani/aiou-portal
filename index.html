<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>AIOU Students Record Portal</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AIOU Portal" />
    <link rel="apple-touch-icon" href="/app_icon_192.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              // Ensure service worker updates promptly
              reg.update().catch(() => {});
            })
            .catch(err => console.warn('Service Worker registration skipped:', err));
        });
      }
    </script>
  </body>
</html>
